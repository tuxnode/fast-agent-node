name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server
        run: pnpm --filter @fast-agent/server typecheck

      - name: Test server
        run: pnpm --filter @fast-agent/server test

      - name: Typecheck SDK
        run: pnpm --filter @fast-agent/sdk typecheck

      - name: Test SDK
        run: pnpm --filter @fast-agent/sdk test
