name: fast-llm-node

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: fast-llm-node/server:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped
